server:
  port: 8083

spring:
  application:
    name: cloudbite-order
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
  config:
    import: optional:nacos:cloudbite-order.yaml
  datasource:
    url: jdbc:mysql://localhost:3306/cloudbite_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

cloudbite:
  sentinel:
    order-qps: 5
  mq:
    namesrv: 127.0.0.1:9876
    topic: cloudbite-order
    producer-group: cloudbite-producer
    consumer-group: cloudbite-close-consumer
    # 演示用 10 秒；生产改 16（30 分钟）
    close-delay-level: 3

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn